# The tests run first and the deploy depends on them. That matters more
# here than usual: tests/privacy.test.js fails the build if a token, a
# budget id, an email address or a third party host ever appears in the
# source, so a mistake cannot reach a public URL.
#
# It also runs once a day, like an exchange rate feed: Card Rewards' card
# details (web/data/cards.json) are re-checked monthly by a scheduled task
# that commits only to the `card-data` branch, never to main. Each run takes
# the newest copy from there, the tests validate it (card_rewards.test.js),
# and the deploy publishes exactly the copy the tests passed. With no
# `card-data` branch yet, the copy on main is used.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      cards: ${{ steps.cards.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the latest card details
        id: cards
        run: |
          if git fetch --depth=1 origin card-data; then
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
            git show FETCH_HEAD:web/data/cards.json > web/data/cards.json
          else
            echo "No card-data branch yet; using the copy on main."
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run the test suite
        run: node --test "web/tests/*.test.js"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Use the same card details the tests passed with
        if: needs.test.outputs.cards != ''
        run: |
          git fetch --depth=1 origin "${{ needs.test.outputs.cards }}"
          git show FETCH_HEAD:web/data/cards.json > web/data/cards.json
      - uses: actions/configure-pages@v5
      - name: Upload the web folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
